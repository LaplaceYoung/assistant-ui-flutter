name: assistant_ui
description: >-
  Flutter port of assistant-ui: the component set, the unstyled primitives, a
  local runtime with streaming, branching and tool calls, and the model
  adapters (data stream, MCP, AG-UI, A2A, LangGraph, Google ADK, generative UI).
version: 0.1.0
repository: https://github.com/LaplaceYoung/assistant-ui-flutter
issue_tracker: https://github.com/LaplaceYoung/assistant-ui-flutter/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Only used by the data stream adapter (Vercel data stream / assistant-stream
  # backends). `http` streams on web through fetch, unlike dart:io.
  http: ^1.2.0
  # The web-preview frame: an iframe registered as a platform view on web only.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
