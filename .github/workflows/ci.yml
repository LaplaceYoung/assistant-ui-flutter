name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Scope the analysis to this package: `landing/` is its own package and
      # is analyzed in the landing job, where its dependencies are resolved.
      - run: flutter analyze lib test example tool
      - run: flutter test --reporter expanded
      - name: Regenerate the coverage matrices
        run: |
          dart run tool/sync_element_coverage.dart
          dart run tool/sync_package_coverage.dart
      - name: Fail when a matrix drifted
        run: git diff --exit-code doc/element-coverage.md doc/package-coverage.md

  landing:
    name: web apps (analyze + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: landing
        run: flutter pub get
      - working-directory: landing
        run: flutter analyze
      - working-directory: landing
        run: flutter test
      - working-directory: landing
        run: flutter build web --release --base-href /assistant-ui-flutter/
      - run: flutter build web --release --base-href /assistant-ui-flutter/gallery/
        working-directory: example
      - name: Assemble the Pages tree (landing at /, gallery at /gallery)
        run: |
          mkdir -p pages/gallery
          cp -R landing/build/web/. pages/
          cp -R example/build/web/. pages/gallery/
          touch pages/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: pages-tree
          path: pages
          retention-days: 5

  deploy:
    name: deploy the landing to Pages
    needs: [package, landing]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-tree
          path: pages-tree
      - name: Publish the build to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-tree
          publish_branch: gh-pages
          commit_message: 'deploy: landing from ${{ github.sha }}'
